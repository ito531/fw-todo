<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>編集内容の確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">編集内容の確認</h1>

        <p class="confirm-value">やること：<span th:text="${todo.title != null and !todo.title.isEmpty() ? todo.title : '（入力なし）'}">（入力なし）</span></p>
        <p class="confirm-value">メモ：<span th:text="${todo.detail != null and !todo.detail.isEmpty() ? todo.detail : '（入力なし）'}">（入力なし）</span></p>
        <p class="confirm-value">ジャンル：<span th:text="${todo.category != null and !todo.category.isEmpty() ? todo.category : '（入力なし）'}">（入力なし）</span></p>
        <p class="confirm-value">優先度：<span th:text="${todo.priority == 1 ? '高' : todo.priority == 2 ? '中' : todo.priority == 3 ? '低' : '（入力なし）'}">（入力なし）</span></p>
        <p class="confirm-value">期限：<span th:text="${todo.dueDate != null ? todo.dueDate : '（入力なし）'}">（入力なし）</span></p>
        <p class="confirm-value">完了：<span th:text="${todo.completed == null ? '（入力なし）' : todo.completed ? '完了' : '未完了'}">（入力なし）</span></p>

        <form th:action="@{/todos/{id}(id=${id})}" method="post" class="confirm-actions">
            <input type="hidden" name="title" th:value="${todo.title}">
            <input type="hidden" name="detail" th:value="${todo.detail}">
            <input type="hidden" name="category" th:value="${todo.category}">
            <input type="hidden" name="priority" th:value="${todo.priority}">
            <input type="hidden" name="dueDate" th:value="${todo.dueDate}">
            <input type="hidden" name="completed" th:value="${todo.completed}">
            <button class="btn" type="submit">保存する</button>
            <button class="btn sub" type="submit" th:formaction="@{/todos/{id}/edit(id=${id})}">書き直す</button>
        </form>
    </div>
</body>
</html>
